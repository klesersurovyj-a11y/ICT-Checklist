name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          FILE="ICT Checklist.xcodeproj"
          TYPE="project"
          SCHEME="ICT Checklist"

          echo "Building scheme: $SCHEME"
          echo "File: $FILE"

          xcodebuild \
            -project "$FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r app.ipa Payload
          ls -lh app.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: app.ipa
          retention-days: 7
