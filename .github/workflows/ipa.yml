name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and scheme
        run: |
          xcodebuild -version
          xcodebuild -list -project "ICT Checklist.xcodeproj"

      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild \
            -project "ICT Checklist.xcodeproj" \
            -scheme "ICT Checklist" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ICT Checklist.app"
          test -d "$APP"
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "ICT-Checklist.ipa" Payload
          shasum -a 256 "ICT-Checklist.ipa" > "ICT-Checklist.ipa.sha256"
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ict-checklist-ipa
          path: |
            out/ICT-Checklist.ipa
            out/ICT-Checklist.ipa.sha256
          if-no-files-found: error

      - name: Attach IPA to the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ipa-latest"
          SHA="$(git rev-parse --short HEAD)"
          NOTES="Unsigned IPA built from ${SHA} on $(date -u '+%d.%m.%Y %H:%M UTC').

          The app is not signed: sign it with your Apple ID before installing
          (for example Sideloadly or AltStore), or use Xcode on a Mac."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "out/ICT-Checklist.ipa#ICT-Checklist.ipa" \
              "out/ICT-Checklist.ipa.sha256#ICT-Checklist.ipa.sha256" \
              --clobber
            gh release edit "$TAG" \
              --title "ICT Checklist — latest IPA" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              "out/ICT-Checklist.ipa#ICT-Checklist.ipa" \
              "out/ICT-Checklist.ipa.sha256#ICT-Checklist.ipa.sha256" \
              --title "ICT Checklist — latest IPA" \
              --notes "$NOTES"
          fi
